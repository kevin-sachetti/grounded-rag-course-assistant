[project]
name = "tcc-chatbot-backend"
version = "0.1.0"
description = "Backend do chatbot educacional customizável com IA"
requires-python = ">=3.14"

dependencies = [
    # API
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-multipart>=0.0.32",

    # Banco de dados
    "sqlalchemy[asyncio]>=2.0.52",
    "psycopg[binary]>=3.3",
    # Teto exigido pelo langchain-postgres 0.0.17 (pgvector<0.4).
    "pgvector>=0.2.5,<0.4",

    # Orquestração / RAG
    "langchain-core>=1.5",
    "langchain-text-splitters>=1.0",
    "langchain-postgres>=0.0.17",
    "langchain-huggingface>=1.2",
    "langgraph>=1.2",

    # Provedores de LLM (usados pelo agente e pela reformulação da resposta)
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",

    # Ingestão
    # OBS: no Docker o torch é instalado antes, do índice CPU-only,
    # para não baixar as bibliotecas CUDA (que pesam alguns GB).
    "torch>=2.13",
    "sentence-transformers>=5.7",
    "openai-whisper>=20250625",
    "pypdf>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
