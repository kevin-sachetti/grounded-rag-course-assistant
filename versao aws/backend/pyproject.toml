[project]
name = "grounded-rag-aws"
version = "0.3.0"
description = "Grounded RAG Assistant — versão AWS (Lambda, DynamoDB, S3, Cognito e Bedrock)"
requires-python = ">=3.14"

dependencies = [
    # API (na Lambda, o Mangum traduz o pedido para o FastAPI)
    "fastapi>=0.141",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "mangum>=0.19",

    # AWS e login
    "boto3>=1.40",
    "pyjwt[crypto]>=2.10",

    # Orquestração / RAG
    "langchain-core>=1.5",
    "langchain-text-splitters>=1.0",
    "langchain-huggingface>=1.2",
    "langchain-aws>=1.0",
    "langgraph>=1.2",
    # Só para testar no computador com o modelo local, sem gastar com o Bedrock.
    "langchain-ollama>=1.0",

    # Busca: os mesmos modelos e versões da versão local.
    # OBS: no Docker o torch é instalado antes, do índice CPU-only.
    "torch>=2.13",
    "sentence-transformers>=5.7",
    "numpy>=2.3",

    # Ingestão: PDF com o pypdf (como na versão local); Word, PowerPoint e
    # Excel com a MarkItDown.
    "pypdf>=6.0",
    "markitdown[docx,pptx,xlsx]>=0.1",
]

[project.optional-dependencies]
# Servidor para rodar a API no computador (na Lambda quem atende é o Mangum).
dev = ["uvicorn[standard]>=0.52"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
