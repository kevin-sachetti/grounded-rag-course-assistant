server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vídeos e áudios podem ser grandes.
    client_max_body_size 1g;

    # A API fica atrás do mesmo endereço: /api/chats -> http://api:8000/chats
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        # Sem placa de vídeo, uma resposta do agente pode levar alguns minutos.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
